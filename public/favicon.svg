<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e38d"/>
      <stop offset="100%" stop-color="#00ff9f"/>
    </linearGradient>
    <linearGradient id="orbit1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e38d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00e38d" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="orbit2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff9f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00e38d" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#1c2b3c" stroke-width="3"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="url(#orbit1)" stroke-width="2"/>
  <ellipse cx="100" cy="100" rx="62" ry="20" fill="none" stroke="url(#orbit2)" stroke-width="4" transform="rotate(-30, 100, 100)"/>
  <ellipse cx="100" cy="100" rx="62" ry="20" fill="none" stroke="url(#orbit1)" stroke-width="4" transform="rotate(30, 100, 100)"/>
  <ellipse cx="100" cy="100" rx="62" ry="20" fill="none" stroke="url(#orbit2)" stroke-width="3" transform="rotate(90, 100, 100)"/>
  <circle cx="100" cy="100" r="16" fill="url(#glow)"/>
  <circle cx="100" cy="100" r="16" fill="none" stroke="#00e38d" stroke-width="3" opacity="0.6">
    <animate attributeName="r" values="16;20;16" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="60" r="4" fill="#00e38d" opacity="0.8"/>
  <circle cx="60" cy="140" r="4" fill="#00e38d" opacity="0.8"/>
  <circle cx="60" cy="60" r="3" fill="#d4e4fa" opacity="0.5"/>
  <circle cx="140" cy="140" r="3" fill="#d4e4fa" opacity="0.5"/>
</svg>